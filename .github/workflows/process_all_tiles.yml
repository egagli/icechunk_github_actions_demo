name: Process All Tiles

# Re-runnable: queries Icechunk history to skip already-processed tiles.
# Run initialize_store.yml first to create the store.

on:
  workflow_dispatch:

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.get-tiles.outputs.matrix }}
      count: ${{ steps.get-tiles.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: v0.39.0
          environments: ci

      - name: Generate tile matrix from Icechunk history
        id: get-tiles
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}
          AZURE_CONTAINER: ${{ secrets.AZURE_CONTAINER }}
          ICECHUNK_PREFIX: ${{ secrets.ICECHUNK_PREFIX }}
        run: |
          OUTPUT=$(pixi run -e ci python scripts/generate_tile_matrix.py)
          COUNT=$(echo "$OUTPUT" | python -c "import sys,json; print(len(json.load(sys.stdin)['tile']))")
          echo "matrix=$OUTPUT" >> $GITHUB_OUTPUT
          echo "count=$COUNT" >> $GITHUB_OUTPUT

  process-tiles:
    needs: generate-matrix
    if: fromJson(needs.generate-matrix.outputs.count) > 0
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: v0.39.0
          environments: ci

      - name: Process tile ${{ matrix.tile.row }}-${{ matrix.tile.col }}
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}
          AZURE_CONTAINER: ${{ secrets.AZURE_CONTAINER }}
          ICECHUNK_PREFIX: ${{ secrets.ICECHUNK_PREFIX }}
        run: |
          pixi run -e ci python scripts/process_tile.py \
            --tile-row ${{ matrix.tile.row }} \
            --tile-col ${{ matrix.tile.col }}
