[workspace]
name = "modis-lst-map"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
nodejs = ">=20"

[tasks]
install = "npm install"
dev = { cmd = "npm run dev", depends-on = ["install"] }
build = { cmd = "npm run build", depends-on = ["install"] }
start = "npm run start"
