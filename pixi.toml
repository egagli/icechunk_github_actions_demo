[workspace]
name = "icechunk-github-actions-demo"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = ">=3.11"
xarray = ">=2025.1"
zarr = ">=3.0"
icechunk = ">=0.2"
numpy = ">=2.0"
dask = "*"
pystac-client = "*"
odc-stac = "*"
odc-geo = "*"
geopandas = "*"
geodatasets = "*"
adlfs = ">=2026.4.0,<2027"
planetary-computer = ">=1.0.0,<2"
rioxarray = ">=0.22.0,<0.23"

[pypi-dependencies]
topozarr = ">=0.0.6"
xproj = ">=0.2.1"

[feature.dev.dependencies]
jupyterlab = "*"
matplotlib = "*"

[environments]
default = { features = ["dev"] }
ci = { solve-group = "default" }

[tasks.setup-kernel] # this is just for my cryocloud setup. run pixi setup-kernel after pixi install to setup kernel and proj
cmd = "python ~/setup_kernel.py"
