[workspace]
name = "icechunk-github-actions-demo"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = ">=3.11"
xarray = ">=2025.1"
zarr = ">=3.0"
icechunk = ">=0.2"
numpy = ">=2.0"
dask = "*"
pystac-client = "*"
odc-stac = "*"
odc-geo = "*"
geopandas = "*"
geodatasets = "*"

[feature.dev.dependencies]
jupyterlab = "*"
matplotlib = "*"

[environments]
default = { features = ["dev"] }
ci = { solve-group = "default" }
